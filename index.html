<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--Makes the page responsive on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The title -->
    <title>Assignment 2 Homepage</title>

    <style>
        /* Basic styling for the whole page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        /* Heading style */
        h1 {
            color: #333;
        }

        /* Info box styling */
        .info {
            margin-top: 20px;
            font-size: 18px;
            color: #555;
            display: inline-block;
            text-align: left;
        }

        /* Paragraphs inside info box */
        .info p {
            margin: 5px 0;
        }

        /* Container for the links for the each questions */
        .link-container {
            margin-top: 40px;
        }

        /* Style for each link button */
        .link-container a {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        /*Changing color when mouse mooving over a link */
        .link-container a:hover {
            background-color: #f382e4;
        }
    </style>
</head>
